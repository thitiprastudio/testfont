<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThitipraStudio & Pinkjulieland - Font Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Prompt:wght@300;400;500;600;700&family=Slackey&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                        slackey: ['Slackey', 'Prompt', 'cursive'],
                    },
                    colors: {
                        brand: {
                            dark: '#D9779B',     
                            main: '#FF9EBB',     
                            light: '#FFF0F5',    
                            text: '#4A332A',     
                            subtext: '#8A6F65'   
                        }
                    },
                    boxShadow: {
                        'app': '0 -10px 40px -15px rgba(255, 158, 187, 0.15), 0 10px 40px -15px rgba(255, 158, 187, 0.15)',
                        'nav': '0 -5px 20px -5px rgba(255, 158, 187, 0.2)'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #FAFAFA; -webkit-tap-highlight-color: transparent; }
        .app-container { max-width: 430px; margin: 0 auto; min-height: 100vh; background-color: #FFF0F5; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.05); overflow-x: hidden; }
        .gradient-bg { background: linear-gradient(180deg, #FF8DAF 0%, #FFB6C1 100%); }
        .stars-bg { background-image: radial-gradient(circle at 15% 30%, white 1px, transparent 1.5px), radial-gradient(circle at 85% 20%, white 1px, transparent 1.5px), radial-gradient(circle at 30% 60%, white 2px, transparent 2.5px), radial-gradient(circle at 75% 70%, white 1.5px, transparent 2px); background-size: 100% 100%; }
        .hero-image-placeholder { width: 150px; height: 150px; background-color: white; border-radius: 50%; border: 4px solid white; box-shadow: 0 10px 20px rgba(255, 158, 187, 0.4); margin: 0 auto; position: relative; z-index: 20; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .page { display: none; animation: fadeIn 0.3s ease-out forwards; padding-bottom: 90px; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
        .modal-content { background: white; width: 100%; max-width: 410px; border-radius: 30px; max-height: 90vh; overflow-y: auto; padding: 24px; position: relative; }
        
        .font-card { background: white; border-radius: 20px; border: 1px solid #ffe4ef; padding: 15px; cursor: pointer; transition: 0.3s; }
        .font-card:hover { border-color: #FF9EBB; }
        .tester-container { width: 100%; background: white; border: 2px dashed #FF9EBB; border-radius: 20px; padding: 20px; text-align: center; }
        
        .price-split-style { background-color: #FFF3B0 !important; color: #8B7355 !important; border-top: 1.5px solid #F6D365 !important; }
        .price-single-style { background-color: #D4EDDA !important; color: #155724 !important; border-top: 1.5px solid #C3E6CB !important; }
    </style>
</head>
<body class="text-brand-text font-sans antialiased">

<div class="app-container flex flex-col">
    <!-- Header -->
    <div class="gradient-bg pt-10 px-6 pb-20 relative rounded-b-[40px] text-center">
        <div class="text-brand-text font-outfit text-2xl font-bold mb-4">THITIPRASTUDIO</div>
        <div class="hero-image-placeholder mx-auto bg-white rounded-full p-2">
            <img src="IPCB5121.PNG" class="w-full h-full rounded-full object-cover" onerror="this.src='https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=Logo';">
        </div>
        <div class="mt-4 text-brand-text font-bold">คลังฟอนต์ลายมือลิขสิทธิ์แท้ (ซิงค์ข้อมูลออนไลน์)</div>
    </div>

    <!-- Main Content -->
    <div class="bg-white rounded-t-[35px] -mt-10 p-6 flex-1">
        <button onclick="checkAdminStatus()" class="w-full bg-pink-100 text-pink-700 font-bold py-2 rounded-xl text-xs mb-4 shadow-sm">🛠️ ระบบหลังบ้าน (แอดมิน)</button>
        <div id="fontList" class="space-y-3"></div>
    </div>

    <!-- Bottom Nav -->
    <div class="fixed bottom-0 w-full max-w-[430px] bg-white border-t p-3 flex justify-between shadow-nav rounded-t-3xl z-40">
        <button onclick="switchTab('page-home')" class="text-brand-main font-bold text-xs"><i class="fa-solid fa-house"></i> หน้าแรก</button>
        <button onclick="checkAdminStatus()" class="text-brand-subtext text-xs"><i class="fa-solid fa-shield-halved"></i> แอดมิน</button>
    </div>
</div>

<!-- Modal: ทดลองพิมพ์ฟอนต์ -->
<div id="fontModal" class="modal">
    <div class="modal-content">
        <button onclick="closeModal('fontModal')" class="absolute top-4 right-4 text-gray-400 hover:text-black"><i class="fas fa-xmark text-lg"></i></button>
        <h2 id="modalFontName" class="font-bold text-lg mb-2 text-center text-brand-dark"></h2>
        <input type="text" id="testerInput" class="w-full border-2 border-pink-100 p-2.5 rounded-xl text-center mb-3 text-xs focus:outline-brand-main" oninput="refreshDisplay()" placeholder="พิมพ์ข้อความทดลองที่นี่...">
        <div class="tester-container">
            <div id="testerDisplay" class="text-2xl">สวัสดี Hello 123</div>
        </div>
        <div id="modalPriceDisplay" class="my-3 p-2.5 rounded-xl text-xs font-semibold text-center"></div>
        <a href="https://lin.ee/8k1sAhb" target="_blank" class="block w-full bg-green-500 text-white py-3 text-center rounded-xl font-bold text-xs mt-2">🛒 สั่งซื้อกับแอดมินผ่าน LINE</a>
    </div>
</div>

<!-- Modal Admin Dashboard (จัดการฟอนต์บน Cloud) -->
<div id="adminDashboardModal" class="modal">
    <div class="modal-content" style="max-width: 600px;">
        <div class="flex justify-between items-center mb-4 border-b pb-2">
            <h2 class="font-bold text-brand-dark">ระบบจัดการฟอนต์ออนไลน์ (Supabase)</h2>
            <button onclick="closeModal('adminDashboardModal')" class="text-xs font-bold bg-pink-100 text-brand-dark px-3 py-1 rounded-full">🏠 กลับหน้าหลัก</button>
        </div>
        
        <form id="fontForm" onsubmit="handleSaveFont(event)" class="space-y-2 text-xs border p-3 rounded-2xl bg-pink-50/30">
            <input type="hidden" id="editFontId">
            <div class="grid grid-cols-2 gap-2">
                <input required type="text" id="newFontTh" class="border p-2 rounded-xl bg-white" placeholder="ชื่อไทย (เช่น สเตฟานี่)">
                <input required type="text" id="newFontEn" class="border p-2 rounded-xl bg-white" placeholder="ชื่ออังกฤษ (เช่น Stephanie)">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <input type="text" id="newFontP" class="border p-2 rounded-xl bg-white" placeholder="ราคา ส่วนตัว (79.-)">
                <input type="text" id="newFontC" class="border p-2 rounded-xl bg-white" placeholder="ราคา พาณิชย์ (169.-)">
            </div>
            <div class="bg-white p-2 rounded-xl border text-[11px]">
                <label class="block font-bold text-gray-700 mb-1">อัปโหลดไฟล์ฟอนต์ (.ttf / .otf)</label>
                <input type="file" id="fileRegular" accept=".ttf,.otf" class="w-full text-xs">
            </div>
            <button type="submit" id="saveBtn" class="w-full bg-brand-dark text-white py-2.5 rounded-xl font-bold transition">+ อัปโหลดและบันทึกฟอนต์ขึ้น Cloud</button>
        </form>
        
        <h4 class="font-bold text-gray-700 text-xs mt-4 mb-2">รายการฟอนต์ในระบบกลาง:</h4>
        <div id="adminFontList" class="space-y-2 max-h-60 overflow-y-auto"></div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://czyjemcsufzrvkcfzfwv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_z10rntPACdi5LPL7lZe4yg_Ka2eCXPY';

    let supabaseClient = null;
    if (typeof supabase !== 'undefined') {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    }

    let fonts = [];
    let currentFont = null;
    let isAdminLoggedIn = false;

    async function init() {
        await loadFontsFromCloud();
    }

    // 1. โหลดข้อมูลฟอนต์จาก Supabase กลาง
    async function loadFontsFromCloud() {
        if (!supabaseClient) return;
        const { data, error } = await supabaseClient.from('fonts').select('*').order('order_index', { ascending: true });
        if (!error) {
            fonts = data || [];
            renderFontCatalog();
        } else {
            console.error("โหลดฟอนต์ไม่สำเร็จ:", error.message);
        }
    }

    // 2. ฟังก์ชันดาวน์โหลดและจดทะเบียนฟอนต์ลงใน Browser เพื่อให้แสดงผลฟอนต์จริงได้
    async function ensureFontLoaded(fontFamily, url) {
        if (!url) return;
        const safeFamilyName = fontFamily.replace(/[^a-zA-Z0-9]/g, '_');
        try {
            if (!document.fonts.check(`16px "${safeFamilyName}"`)) {
                const fontFace = new FontFace(safeFamilyName, `url(${url})`);
                const loaded = await fontFace.load();
                document.fonts.add(loaded);
            }
        } catch (e) {
            console.error("Font load error:", e);
        }
    }

    // 3. แสดงผลรายการฟอนต์หน้าเว็บ
    function renderFontCatalog() {
        const list = document.getElementById('fontList');
        list.innerHTML = "";

        if (fonts.length === 0) {
            list.innerHTML = `<div class="text-center py-10 text-gray-400 text-xs">ยังไม่มีฟอนต์ในระบบกลาง (คลิกปุ่มแอดมินเพื่อเพิ่มฟอนต์)</div>`;
            return;
        }

        fonts.forEach((f, idx) => {
            const safeFamilyName = f.en.replace(/[^a-zA-Z0-9]/g, '_');
            const isSingle = (f.p === f.c);
            const priceTxt = isSingle ? `ราคาเดียว: ${f.p}` : `ส่วนตัว: ${f.p} | เชิงพาณิชย์: ${f.c}`;
            
            if (f.file_regular) {
                ensureFontLoaded(f.en, f.file_regular);
            }

            const card = document.createElement('div');
            card.className = 'font-card mb-3';
            card.innerHTML = `
                <div class="font-bold text-sm text-brand-text flex justify-between items-center" style="font-family:'${safeFamilyName}', sans-serif">
                    <span>${(idx + 1).toString().padStart(2, '0')}. ${f.th} (${f.en})</span>
                    <span class="text-[10px] text-pink-400 font-sans">✨ ทดลองพิมพ์</span>
                </div>
                <div class="py-4 text-center text-2xl text-gray-800" style="font-family:'${safeFamilyName}', sans-serif">สวัสดี Hello 123</div>
                <div class="pt-2 border-t border-pink-100 flex justify-between items-center text-xs">
                    <span class="text-gray-600 truncate mr-2">${priceTxt}</span>
                    <button onclick="event.stopPropagation(); openModal(${JSON.stringify(f).replace(/"/g, '&quot;')})" class="bg-green-500 text-white px-3 py-1 rounded-full font-bold text-[11px] shrink-0">🛒 สั่งซื้อ</button>
                </div>
            `;
            card.onclick = () => openModal(f);
            list.appendChild(card);
        });
    }

    // 4. แอดมินอัปโหลดไฟล์ขึ้น Supabase Storage และบันทึกลง Database
    async function handleSaveFont(e) {
        e.preventDefault();
        const th = document.getElementById('newFontTh').value.trim();
        const en = document.getElementById('newFontEn').value.trim();
        const p = document.getElementById('newFontP').value.trim() || '79.-';
        const c = document.getElementById('newFontC').value.trim() || '169.-';
        const file = document.getElementById('fileRegular').files[0];

        if (!file) {
            alert('กรุณาเลือกไฟล์ฟอนต์ .ttf หรือ .otf');
            return;
        }

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.innerText = 'กำลังอัปโหลดขึ้น Cloud...';
        saveBtn.disabled = true;

        try {
            // อัปโหลดไฟล์ไปที่ Supabase Storage (Bucket: font-files)
            const fileExt = file.name.split('.').pop();
            const fullPath = `${en}_${Date.now()}.${fileExt}`;
            const { error: uploadErr } = await supabaseClient.storage.from('font-files').upload(fullPath, file, { upsert: true });
            
            if (uploadErr) throw new Error(uploadErr.message);

            // ดึง Public URL ของไฟล์
            const { data: urlData } = supabaseClient.storage.from('font-files').getPublicUrl(fullPath);
            const fileUrl = urlData.publicUrl;

            // บันทึกข้อมูลลงตาราง fonts ใน Supabase
            const { error: dbErr } = await supabaseClient.from('fonts').insert([{
                th, en, p, c, file_regular: fileUrl, order_index: fonts.length + 1
            }]);

            if (dbErr) throw new Error(dbErr.message);

            alert('เพิ่มฟอนต์ขึ้น Cloud สำเร็จ! ทุกเครื่องจะเห็นฟอนต์นี้ทันที');
            document.getElementById('fontForm').reset();
            saveBtn.innerText = '+ บันทึกฟอนต์ขึ้นระบบ Cloud';
            saveBtn.disabled = false;
            
            await loadFontsFromCloud();
            renderAdminFontList();
        } catch (err) {
            alert('เกิดข้อผิดพลาด: ' + err.message);
            saveBtn.innerText = '+ บันทึกฟอนต์ขึ้นระบบ Cloud';
            saveBtn.disabled = false;
        }
    }

    async function renderAdminFontList() {
        const list = document.getElementById('adminFontList');
        if (!supabaseClient) return;
        const { data } = await supabaseClient.from('fonts').select('*').order('order_index');
        list.innerHTML = (data || []).map((f, idx) => `
            <div class="flex justify-between items-center p-2 bg-gray-50 border rounded-xl text-xs">
                <span><b>${idx+1}. ${f.th} (${f.en})</b></span>
                <button onclick="deleteFont('${f.id}')" class="bg-red-500 text-white px-2 py-0.5 rounded text-[10px]">ลบ</button>
            </div>
        `).join('');
    }

    async function deleteFont(id) {
        if (!confirm('ยืนยันลบฟอนต์นี้จากระบบกลาง?')) return;
        await supabaseClient.from('fonts').delete().eq('id', id);
        await loadFontsFromCloud();
        renderAdminFontList();
    }

    function openModal(f) {
        currentFont = f;
        const safeFamily = f.en.replace(/[^a-zA-Z0-9]/g, '_');
        document.getElementById('modalFontName.').innerText = f.th; // ป้องกันจุดผิดพลาด
        document.getElementById('modalFontName').innerText = `${f.th} (${f.en})`;
        document.getElementById('modalFontName').style.fontFamily = safeFamily;
        document.getElementById('testerDisplay').style.fontFamily = safeFamily;
        document.getElementById('fontModal').style.display = 'flex';
        refreshDisplay();
    }

    function refreshDisplay() {
        const txt = document.getElementById('testerInput').value;
        const disp = document.getElementById('testerDisplay');
        if (disp && currentFont) {
            disp.innerText = txt || "สวัสดี Hello! กขฃค 12345";
        }
    }

    function checkAdminStatus() {
        if (isAdminLoggedIn) {
            renderAdminFontList();
            document.getElementById('adminDashboardModal').style.display = 'flex';
        } else {
            const pass = prompt("กรุณากรอกรหัสผ่านแอดมิน:");
            if (pass === 'pleng235') {
                isAdminLoggedIn = true;
                renderAdminFontList();
                document.getElementById('adminDashboardModal').style.display = 'flex';
            } else {
                alert('รหัสผ่านแอดมินไม่ถูกต้อง');
            }
        }
    }

    function adminLogout() {
        isAdminLoggedIn = false;
        closeModal('adminDashboardModal');
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    function switchAdminTab(tab) {
        ['Fonts', 'Menus', 'Orders'].forEach(t => {
            const el = document.getElementById(`adminTab${t}`);
            if (el) el.classList.add('hidden');
        });
        document.getElementById(`adminTab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.remove('hidden');
    }

    init();
</script>
</body>
</html>
