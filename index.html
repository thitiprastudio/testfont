<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Font Store & Live Tester</title>
  
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Google Fonts (Prompt & Kanit สำหรับ UI และตัวอย่างฟอนต์) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;700&family=Charm:wght@400;700&family=Kanit:wght@300;400;700&family=Mitr:wght@300;400;700&family=Prompt:ital,wght@0,300;0,400;0,700;1,400&family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Prompt', sans-serif; }
    .font-sample-mitr { font-family: 'Mitr', sans-serif; }
    .font-sample-sarabun { font-family: 'Sarabun', sans-serif; }
    .font-sample-kanit { font-family: 'Kanit', sans-serif; }
    .font-sample-charm { font-family: 'Charm', cursive; }
    .font-sample-chakra { font-family: 'Chakra Petch', sans-serif; }
  </style>
</head>
<body class="bg-rose-50/40 text-slate-800 min-h-screen flex flex-col">

  <!-- ================= Header ================= -->
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-rose-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="p-2 rounded-xl text-slate-600 hover:bg-rose-100/60 transition" aria-label="Open Sidebar">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <a href="#" class="flex items-center gap-2">
          <span class="w-8 h-8 rounded-full bg-rose-400 text-white flex items-center justify-center font-bold text-lg shadow-sm">Aa</span>
          <span class="text-xl font-bold bg-gradient-to-r from-rose-500 to-pink-500 bg-clip-text text-transparent">Fontie.Studio</span>
        </a>
      </div>

      <div class="flex items-center gap-2 sm:gap-4">
        <button onclick="toggleVSMode()" class="px-3 py-1.5 rounded-full border border-rose-300 text-rose-600 hover:bg-rose-50 text-xs sm:text-sm font-semibold flex items-center gap-1.5 transition">
          <i data-lucide="split" class="w-4 h-4"></i>
          <span class="hidden sm:inline">โหมดเปรียบเทียบ</span> (VS)
        </button>
        <button class="flex items-center gap-2 px-3 py-1.5 bg-rose-500 text-white rounded-full hover:bg-rose-600 transition shadow-sm text-xs sm:text-sm font-medium">
          <i data-lucide="user" class="w-4 h-4"></i>
          <span>เข้าสู่ระบบ</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ================= Sidebar Drawer ================= -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 w-64 bg-white shadow-2xl z-50 transform -translate-x-full transition-transform duration-300 ease-in-out border-r border-rose-100 flex flex-col justify-between p-6">
    <div>
      <div class="flex justify-between items-center mb-8">
        <h2 class="text-lg font-bold text-rose-500">✨ เมนูหลัก</h2>
        <button onclick="toggleSidebar()" class="p-1 rounded-lg text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-6 h-6"></i>
        </button>
      </div>
      <nav class="space-y-2 text-sm font-medium">
        <a href="#" class="flex items-center gap-3 px-3 py-2 text-rose-600 bg-rose-50 rounded-xl"><i data-lucide="sparkles" class="w-4 h-4"></i> คอลเลกชันทั้งหมด</a>
        <a href="#" class="flex items-center gap-3 px-3 py-2 text-slate-600 hover:bg-rose-50/50 rounded-xl"><i data-lucide="heart" class="w-4 h-4"></i> รายการโปรด</a>
        <a href="#" class="flex items-center gap-3 px-3 py-2 text-slate-600 hover:bg-rose-50/50 rounded-xl"><i data-lucide="shield-check" class="w-4 h-4"></i> เงื่อนไขลิขสิทธิ์</a>
        <a href="#" class="flex items-center gap-3 px-3 py-2 text-slate-600 hover:bg-rose-50/50 rounded-xl"><i data-lucide="headset" class="w-4 h-4"></i> ติดต่อทีมงาน</a>
      </nav>
    </div>
    <p class="text-xs text-slate-400 text-center">© 2026 Fontie.Studio</p>
  </aside>
  <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/20 z-40 hidden backdrop-blur-[2px]"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-1">

    <!-- ================= Search & Price Filters ================= -->
    <section class="mb-8 space-y-4">
      <div class="flex flex-col md:flex-row gap-4 justify-between items-stretch md:items-center">
        
        <!-- แถบค้นหา -->
        <div class="relative flex-1 max-w-lg">
          <i data-lucide="search" class="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input 
            type="text" 
            id="search-input" 
            oninput="handleSearch()"
            placeholder="ค้นหาชื่อฟอนต์ เช่น คาเฟ่, โมเดิร์น, ลายมือ..." 
            class="w-full pl-10 pr-4 py-2.5 bg-white border border-rose-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-rose-400 text-sm shadow-sm"
          >
        </div>

        <!-- กรองราคา -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 md:pb-0 text-xs sm:text-sm">
          <button onclick="setFilter('all', this)" class="filter-btn active px-4 py-2 rounded-xl font-medium bg-rose-500 text-white shadow-sm transition">ทั้งหมด</button>
          <button onclick="setFilter('tiered', this)" class="filter-btn px-4 py-2 rounded-xl font-medium bg-white text-slate-600 border border-rose-200 hover:bg-rose-50 transition">แยกสิทธิ์</button>
          <button onclick="setFilter('single', this)" class="filter-btn px-4 py-2 rounded-xl font-medium bg-white text-slate-600 border border-rose-200 hover:bg-rose-50 transition">ราคาเดียว</button>
        </div>

      </div>
    </section>

    <!-- ================= VS Comparison Modal ================= -->
    <section id="vs-section" class="hidden mb-10 p-6 bg-white border border-rose-200 rounded-3xl shadow-lg relative">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
          <span class="p-1.5 bg-rose-100 text-rose-500 rounded-lg"><i data-lucide="columns" class="w-5 h-5"></i></span>
          VS Mode (เปรียบเทียบสด)
        </h3>
        <button onclick="toggleVSMode()" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Font Left -->
        <div class="p-4 bg-rose-50/40 rounded-2xl border border-rose-100 space-y-3">
          <select id="vs-font-1" onchange="renderVS()" class="w-full bg-white border border-rose-200 rounded-xl px-3 py-2 text-sm font-semibold"></select>
          <textarea id="vs-text-1" rows="3" class="w-full bg-transparent border-0 focus:ring-0 text-slate-800 text-xl resize-none outline-none leading-relaxed">พิมพ์ข้อความเปรียบเทียบที่นี่...</textarea>
        </div>
        <!-- Font Right -->
        <div class="p-4 bg-rose-50/40 rounded-2xl border border-rose-100 space-y-3">
          <select id="vs-font-2" onchange="renderVS()" class="w-full bg-white border border-rose-200 rounded-xl px-3 py-2 text-sm font-semibold"></select>
          <textarea id="vs-text-2" rows="3" class="w-full bg-transparent border-0 focus:ring-0 text-slate-800 text-xl resize-none outline-none leading-relaxed">พิมพ์ข้อความเปรียบเทียบที่นี่...</textarea>
        </div>
      </div>
    </section>

    <!-- ================= Font Cards Grid ================= -->
    <!-- Grid System: 1 คอลัมน์บนมือถือ | 2 บนแท็บเล็ต | 3 บนคอมพิวเตอร์ -->
    <div id="fonts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Font Cards rendered via JavaScript -->
    </div>

  </main>

  <!-- ================= App Logic ================= -->
  <script>
    // 1. จำลองข้อมูล Supabase หรือเชื่อมต่อจริง
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = (SUPABASE_URL !== "YOUR_SUPABASE_URL") 
      ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) 
      : null;

    const LINE_OA_ID = "@yourfontshop"; // ไอดี LINE OA สำหรับรับคำสั่งซื้อ

    // Fallback Data กรณีที่ยังไม่ได้ตั้งค่าคีย์ Supabase
    let allFonts = [
      { id: '1', name: 'Mitr Sweetie', class: 'font-sample-mitr', pricing_type: 'tiered', prices: { personal: 290, commercial: 590, business: 1200 }, author: 'Studio Peach' },
      { id: '2', name: 'Sarabun Modern', class: 'font-sample-sarabun', pricing_type: 'single', prices: { personal: 350, commercial: 350, business: 350 }, author: 'Craft Type' },
      { id: '3', name: 'Kanit Chunky', class: 'font-sample-kanit', pricing_type: 'tiered', prices: { personal: 390, commercial: 790, business: 1500 }, author: 'Studio Peach' },
      { id: '4', name: 'Charm Handwriting', class: 'font-sample-charm', pricing_type: 'single', prices: { personal: 199, commercial: 199, business: 199 }, author: 'Little Note' },
      { id: '5', name: 'Chakra Cyber', class: 'font-sample-chakra', pricing_type: 'tiered', prices: { personal: 450, commercial: 890, business: 2000 }, author: 'Neo Design' }
    ];

    let currentFilter = 'all';

    // 2. Fetch Data
    async function loadFonts() {
      if (supabase) {
        const { data, error } = await supabase.from('fonts').select('*');
        if (!error && data && data.length > 0) allFonts = data;
      }
      renderCards(allFonts);
      populateVSSelectors();
    }

    // 3. Render Cards
    function renderCards(list) {
      const container = document.getElementById('fonts-grid');
      container.innerHTML = '';

      if (list.length === 0) {
        container.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400">ไม่พบฟอนต์ที่ค้นหา</div>`;
        return;
      }

      list.forEach(font => {
        const card = document.createElement('div');
        card.className = "bg-white border border-rose-100 rounded-3xl p-5 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between";
        card.innerHTML = `
          <div>
            <!-- Header Card -->
            <div class="flex justify-between items-start mb-3">
              <div>
                <h3 class="font-bold text-base text-slate-800">${font.name}</h3>
                <p class="text-xs text-slate-400">โดย ${font.author}</p>
              </div>
              <span class="text-[11px] font-semibold px-2.5 py-1 rounded-full ${font.pricing_type === 'single' ? 'bg-amber-100 text-amber-700' : 'bg-rose-100 text-rose-700'}">
                ${font.pricing_type === 'single' ? 'ราคาเดียว' : 'แยกสิทธิ์'}
              </span>
            </div>

            <!-- Controls (Size & Weight) -->
            <div class="flex items-center gap-2 mb-3 bg-rose-50/50 p-2 rounded-xl text-xs">
              <span class="text-slate-500 font-medium">ขนาด:</span>
              <input type="range" min="16" max="48" value="24" oninput="updateFontSize(this, 'preview-${font.id}')" class="w-20 accent-rose-500 cursor-pointer">
              
              <div class="flex gap-1 ml-auto">
                <button onclick="setFontWeight('preview-${font.id}', 300)" class="px-2 py-0.5 bg-white border border-rose-200 rounded text-[10px] hover:bg-rose-100">บาง</button>
                <button onclick="setFontWeight('preview-${font.id}', 400)" class="px-2 py-0.5 bg-white border border-rose-200 rounded text-[10px] hover:bg-rose-100">ปกติ</button>
                <button onclick="setFontWeight('preview-${font.id}', 700)" class="px-2 py-0.5 bg-white border border-rose-200 rounded text-[10px] hover:bg-rose-100">หนา</button>
              </div>
            </div>

            <!-- Interactive Text Area -->
            <div class="mb-4">
              <textarea 
                id="preview-${font.id}" 
                class="${font.class || ''} w-full min-h-[90px] p-3 rounded-xl border border-rose-100 bg-rose-50/20 focus:bg-white focus:outline-none focus:ring-1 focus:ring-rose-400 text-slate-700 resize-none transition"
                style="font-size: 24px; font-weight: 400;"
              >ก้าวแรกไม่เป็นไร ก้าวต่อไปเริ่มชอบฟอนต์นี้แล้ว ✨</textarea>
            </div>
          </div>

          <!-- Bottom: Price Selection & LINE CTA -->
          <div class="border-t border-rose-100 pt-3 space-y-2">
            <div class="flex items-center justify-between text-xs">
              <label class="text-slate-500 font-medium">สิทธิ์การใช้งาน:</label>
              <select id="license-${font.id}" onchange="updatePriceDisplay('${font.id}')" class="bg-rose-50 border border-rose-200 rounded-lg px-2 py-1 outline-none text-slate-700">
                <option value="personal">Personal (ใช้ส่วนตัว)</option>
                <option value="commercial">Commercial (เชิงพาณิชย์)</option>
                <option value="business">Business (องค์กร/แบรนด์)</option>
              </select>
            </div>
            
            <div class="flex items-center justify-between">
              <div>
                <span class="text-xs text-slate-400">ราคา: </span>
                <span id="price-${font.id}" class="text-base font-bold text-rose-500">฿${font.prices.personal}</span>
              </div>
              <button onclick="orderViaLine('${font.id}')" class="flex items-center gap-1.5 px-4 py-2 bg-[#06C755] hover:bg-[#05b04b] text-white rounded-xl text-xs font-semibold shadow-sm transition">
                <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i>
                สั่งซื้อผ่าน LINE
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
      lucide.createIcons();
    }

    // 4. Interactive Adjustments
    function updateFontSize(slider, elementId) {
      document.getElementById(elementId).style.fontSize = `${slider.value}px`;
    }

    function setFontWeight(elementId, weight) {
      document.getElementById(elementId).style.fontWeight = weight;
    }

    function updatePriceDisplay(fontId) {
      const font = allFonts.find(f => f.id === fontId);
      const license = document.getElementById(`license-${fontId}`).value;
      document.getElementById(`price-${fontId}`).innerText = `฿${font.prices[license]}`;
    }

    // 5. Line OA Order Link
    function orderViaLine(fontId) {
      const font = allFonts.find(f => f.id === fontId);
      const license = document.getElementById(`license-${fontId}`).value;
      const price = font.prices[license];
      
      const message = `สวัสดีครับ/ค่ะ ต้องการสั่งซื้อฟอนต์ ✨%0A- ฟอนต์: ${encodeURIComponent(font.name)}%0A- สิทธิ์: ${license.toUpperCase()}%0A- ราคา: ฿${price}`;
      const lineUrl = `https://line.me/R/oaMessage/${LINE_OA_ID}/?${message}`;
      
      window.open(lineUrl, '_blank');
    }

    // 6. Search & Filters
    function handleSearch() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allFonts.filter(f => {
        const matchName = f.name.toLowerCase().includes(query);
        const matchFilter = currentFilter === 'all' || f.pricing_type === currentFilter;
        return matchName && matchFilter;
      });
      renderCards(filtered);
    }

    function setFilter(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => {
        b.className = "filter-btn px-4 py-2 rounded-xl font-medium bg-white text-slate-600 border border-rose-200 hover:bg-rose-50 transition";
      });
      btn.className = "filter-btn active px-4 py-2 rounded-xl font-medium bg-rose-500 text-white shadow-sm transition";
      handleSearch();
    }

    // 7. Sidebar Controls
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');
      const isOpen = !sidebar.classList.contains('-translate-x-full');
      
      if (isOpen) {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      } else {
        sidebar.classList.remove('-translate-x-full');
        overlay.classList.remove('hidden');
      }
    }

    // 8. VS Mode Setup
    function toggleVSMode() {
      const vs = document.getElementById('vs-section');
      vs.classList.toggle('hidden');
      if (!vs.classList.contains('hidden')) {
        renderVS();
      }
    }

    function populateVSSelectors() {
      const s1 = document.getElementById('vs-font-1');
      const s2 = document.getElementById('vs-font-2');
      s1.innerHTML = '';
      s2.innerHTML = '';
      
      allFonts.forEach((f, idx) => {
        s1.add(new Option(f.name, f.class, idx === 0, idx === 0));
        s2.add(new Option(f.name, f.class, idx === 1, idx === 1));
      });
    }

    function renderVS() {
      const s1 = document.getElementById('vs-font-1').value;
      const s2 = document.getElementById('vs-font-2').value;
      const t1 = document.getElementById('vs-text-1');
      const t2 = document.getElementById('vs-text-2');
      
      t1.className = `${s1} w-full bg-transparent border-0 focus:ring-0 text-slate-800 text-2xl resize-none outline-none leading-relaxed`;
      t2.className = `${s2} w-full bg-transparent border-0 focus:ring-0 text-slate-800 text-2xl resize-none outline-none leading-relaxed`;
    }

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadFonts();
    });
  </script>
</body>
</html>
